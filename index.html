/* ═══════ TABS ═══════ */
let tabAtual='painel';
function mudarTab(t){
  tabAtual=t;
  document.querySelectorAll('.pg-tab').forEach(p=>p.classList.remove('act'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('act'));
  document.getElementById('pg-'+t)?.classList.add('act');
  document.getElementById('tab-'+t)?.classList.add('act');
  ({painel:renderPainel,gastos:renderGastos,fixos:renderFixos,metas:renderMetas,projecao:renderProjecao})[t]?.();
}

/* ═══════ CÁLCULOS BASE ═══════ */
function calcMes(mes,ano){
  const gastosMes=S.gastos.filter(g=>{
    const d=new Date(g.data_iso+'T12:00:00');
    return d.getMonth()===mes&&d.getFullYear()===ano;
  });
  const totalVar=gastosMes.reduce((a,g)=>a+g.valor,0);
  const totalFix=S.fixos.reduce((a,f)=>a+f.valor,0);
  const totalRec=S.receitas.reduce((a,r)=>a+r.valor,0);
  const totalInv=S.investimentos.reduce((a,i)=>a+(i.aporte_mensal||0),0);
  const totalGastos=totalVar+totalFix;
  const saldo=totalRec-totalGastos-totalInv;
  return{gastosMes,totalVar,totalFix,totalRec,totalInv,totalGastos,saldo};
}

/* ═══════ PAINEL ═══════ */
function renderPainel(){
  const{totalVar,totalFix,totalRec,totalInv,totalGastos,saldo}=calcMes(mesAtual(),anoAtual());
  const pctGasto=pct(totalGastos,totalRec);

  // Hero
  document.getElementById('hero-wrap').innerHTML=`
    <div class="hero-fin">
      <div class="hero-mes">💰 ${MESES_FULL[mesAtual()]} ${anoAtual()}</div>
      <div class="hero-saldo" style="color:${saldo>=0?'var(--grn)':'var(--pink)'}">${fm(saldo)}</div>
      <div class="hero-sub">${saldo>=0?'✓ saldo positivo':'⚠️ saldo negativo'} este mês</div>
      <div class="hero-chips">
        <div class="hero-chip chip-g">↑ ${fm(totalRec)}</div>
        <div class="hero-chip chip-r">↓ ${fm(totalGastos)}</div>
        <div class="hero-chip chip-b">📈 ${fm(totalInv)}</div>
      </div>
    </div>`;

  // Alertas financeiros
  const alertas=[];
  const hoje_d=hoje().getDate();
  S.fixos.forEach(f=>{
    if(f.venc&&f.venc-hoje_d>=0&&f.venc-hoje_d<=5){
      alertas.push({tipo:'crit',txt:`${f.nome} vence em ${f.venc-hoje_d===0?'hoje':f.venc-hoje_d+' dias'}`,val:fm(f.valor)});
    }
  });
  if(pctGasto>85) alertas.push({tipo:'warn',txt:`Gastos em ${pctGasto}% da receita`,val:''});
  if(totalRec===0) alertas.push({tipo:'info',txt:'Receita não configurada — adicione em Fixos',val:''});

  document.getElementById('alertas-fin-wrap').innerHTML=alertas.length?`
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">🚨 Alertas</div>
      ${alertas.map(a=>`
        <div class="venc-item ${a.tipo}">
          <span style="font-size:.9rem">${a.tipo==='crit'?'🔴':a.tipo==='warn'?'🟡':'🔵'}</span>
          <span class="venc-nome">${a.txt}</span>
          ${a.val?`<span class="venc-val">${a.val}</span>`:''}
        </div>`).join('')}
    </div>`:'' ;

  // Gráfico rosca por categoria
  const porCat={};
  S.gastos.filter(g=>{
    const d=new Date(g.data_iso+'T12:00:00');
    return d.getMonth()===mesAtual()&&d.getFullYear()===anoAtual();
  }).forEach(g=>{porCat[g.categoria]=(porCat[g.categoria]||0)+g.valor;});
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const coresDonut=['var(--cyan)','var(--pink)','var(--yel)','var(--pur)','var(--grn)'];

  if(cats.length>0){
    const total=cats.reduce((a,c)=>a+c[1],0);
    let offset=0;const r=54,circ=2*Math.PI*r;
    const segmentos=cats.map((c,i)=>{
      const frac=c[1]/total;
      const dash=frac*circ;
      const seg=`<circle cx="64" cy="64" r="${r}" fill="none" stroke="${coresDonut[i]}"
        stroke-width="20" stroke-dasharray="${dash} ${circ-dash}"
        stroke-dashoffset="${-offset}" transform="rotate(-90 64 64)"/>`;
      offset+=dash;return seg;
    }).join('');

    document.getElementById('donut-wrap-ext').innerHTML=`
      <div class="card">
        <div class="card-title">📊 Gastos por Categoria</div>
        <div class="donut-wrap">
          <svg class="donut-svg" width="128" height="128" viewBox="0 0 128 128">
            <circle cx="64" cy="64" r="54" fill="none" stroke="var(--bdr)" stroke-width="20"/>
            ${segmentos}
            <text x="64" y="60" text-anchor="middle" fill="var(--txt)" font-size="11" font-weight="800" font-family="JetBrains Mono">${fm(totalVar).replace('R$\u00a0','R$')}</text>
            <text x="64" y="76" text-anchor="middle" fill="var(--sub)" font-size="9" font-family="Space Grotesk">variável</text>
          </svg>
          <div class="donut-legend">
            ${cats.map((c,i)=>{
              const cat=CATS[c[0]]||{ic:'💸',label:c[0]};
              return `<div class="legend-item">
                <div class="legend-dot" style="background:${coresDonut[i]}"></div>
                <div class="legend-label">${cat.ic} ${cat.label}</div>
                <div class="legend-val">${Math.round(c[1]/total*100)}%</div>
              </div>`;
            }).join('')}
          </div>
        </div>
        <div class="sum-grid" style="margin-bottom:0">
          <div class="sum-card g">
            <div class="sum-label">Receita</div>
            <div class="sum-val" style="font-size:1rem">${fm(totalRec)}</div>
          </div>
          <div class="sum-card p">
            <div class="sum-label">Total gasto</div>
            <div class="sum-val" style="font-size:1rem">${fm(totalGastos)}</div>
            <div class="sum-sub">${pctGasto}% da receita</div>
          </div>
        </div>
      </div>`;
  } else {
    document.getElementById('donut-wrap-ext').innerHTML=`
      <div class="card">
        <div class="card-title">📊 Gastos por Categoria</div>
        <div style="text-align:center;padding:20px;color:var(--sub);font-size:.82rem">Nenhum gasto registrado este mês.<br>Toque em "+" para lançar.</div>
      </div>`;
  }

  // Vencimentos próximos
  const vencimentos=S.fixos.filter(f=>f.venc).sort((a,b)=>a.venc-b.venc);
  if(vencimentos.length){
    document.getElementById('vencimentos-wrap').innerHTML=`
      <div class="card">
        <div class="card-title">📅 Vencimentos do Mês</div>
        ${vencimentos.map(f=>{
          const diasFalta=f.venc-hoje().getDate();
          const cls=diasFalta<0?'ok':diasFalta<=3?'crit':diasFalta<=7?'warn':'ok';
          return `<div class="venc-item ${cls}">
            <span style="font-size:.9rem">${diasFalta<0?'✅':diasFalta<=3?'🔴':'🟡'}</span>
            <div style="flex:1">
              <div class="venc-nome">${f.nome}</div>
              <div class="venc-dia">${diasFalta<0?'Pago':'Dia '+f.venc+(diasFalta<=7&&diasFalta>=0?' — '+diasFalta+'d':'')} </div>
            </div>
            <span class="venc-val">${fm(f.valor)}</span>
          </div>`;
        }).join('')}
      </div>`;
  } else {
    document.getElementById('vencimentos-wrap').innerHTML='';
  }
}

/* ═══════ GASTOS ═══════ */
function renderGastos(){
  const mes=parseInt(document.getElementById('filtro-mes')?.value??mesAtual());
  const ano=parseInt(document.getElementById('filtro-ano')?.value??anoAtual());
  const{gastosMes,totalVar,totalFix,totalRec,totalGastos,saldo}=calcMes(mes,ano);

  // Summary
  document.getElementById('gastos-summary').innerHTML=`
    <div class="sum-grid">
      <div class="sum-card p">
        <div class="sum-label">Variáveis</div>
        <div class="sum-val" style="font-size:1.05rem">${fm(totalVar)}</div>
        <div class="sum-sub">${gastosMes.length} lançamentos</div>
      </div>
      <div class="sum-card b">
        <div class="sum-label">Fixos</div>
        <div class="sum-val" style="font-size:1.05rem">${fm(totalFix)}</div>
        <div class="sum-sub">${S.fixos.length} contas</div>
      </div>
      <div class="sum-card g">
        <div class="sum-label">Receita</div>
        <div class="sum-val" style="font-size:1.05rem">${fm(totalRec)}</div>
      </div>
      <div class="sum-card ${saldo>=0?'g':'p'}">
        <div class="sum-label">Saldo</div>
        <div class="sum-val" style="font-size:1.05rem">${fm(saldo)}</div>
        <div class="sum-sub">${saldo>=0?'✓ positivo':'⚠️ negativo'}</div>
      </div>
    </div>
    <div class="prog-wrap">
      <div class="prog-top">
        <span class="prog-label">Gastos vs Receita</span>
        <span class="prog-val">${pct(totalGastos,totalRec)}%</span>
      </div>
      <div class="prog-track" style="height:10px">
        <div class="prog-fill" style="width:${pct(totalGastos,totalRec)}%;background:${pct(totalGastos,totalRec)>90?'var(--red)':pct(totalGastos,totalRec)>75?'var(--yel)':'var(--grn)'}"></div>
      </div>
    </div>`;

  // Lista
  if(gastosMes.length===0){
    document.getElementById('gastos-lista').innerHTML=`<div style="text-align:center;padding:20px;color:var(--sub);font-size:.82rem">Nenhum gasto em ${MESES_FULL[mes]}.</div>`;
    return;
  }
  const agrupados={};
  gastosMes.sort((a,b)=>b.data_iso.localeCompare(a.data_iso)).forEach(g=>{
    if(!agrupados[g.data_iso]) agrupados[g.data_iso]=[];
    agrupados[g.data_iso].push(g);
  });
  document.getElementById('gastos-lista').innerHTML=Object.entries(agrupados).map(([data,itens])=>`
    <div style="font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);padding:10px 0 4px">
      ${new Date(data+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})}
    </div>
    ${itens.map(g=>{
      const cat=CATS[g.categoria]||{ic:'💸',label:'Outros',cor:'var(--sub)'};
      return `<div class="list-item" onclick="editarGasto('${g.id}')">
        <div class="list-ico" style="background:${cat.cor}22">${cat.ic}</div>
        <div class="list-info">
          <div class="list-title">${g.descricao||cat.label}</div>
          <div class="list-sub">${cat.label}${g.obs?' · '+g.obs:''}</div>
        </div>
        <div class="list-right neg">${fm(g.valor)}</div>
      </div>`;
    }).join('')}`).join('');
}

function editarGasto(id){
  const g=S.gastos.find(x=>x.id===id);if(!g)return;
  document.getElementById('sheet-content').innerHTML=`
    <div class="sheet-title">✏️ Editar Gasto</div>
    <div class="fg"><label class="fl">Descrição</label><input class="fi" id="eg-desc" value="${g.descricao||''}"></div>
    <div class="fr2">
      <div class="fg"><label class="fl">Valor (R$)</label><input class="fi" type="number" id="eg-val" value="${g.valor}" step="0.01"></div>
      <div class="fg"><label class="fl">Categoria</label>
        <select class="fi" id="eg-cat">
          ${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${g.categoria===k?'selected':''}>${v.ic} ${v.label}</option>`).join('')}
        </select></div>
    </div>
    <div class="fg"><label class="fl">Data</label><input class="fi" type="date" id="eg-data" value="${g.data_iso}"></div>
    <button class="btn btn-primary" onclick="salvarEdicaoGasto('${id}')">💾 Salvar</button>
    <button class="btn btn-danger" onclick="deletarGasto('${id}')">🗑 Excluir</button>
    <button class="btn btn-ghost" onclick="fecharSheet()">Cancelar</button>`;
  document.getElementById('overlay').classList.add('open');
}

function salvarEdicaoGasto(id){
  const g=S.gastos.find(x=>x.id===id);if(!g)return;
  g.descricao=document.getElementById('eg-desc').value;
  g.valor=parseFloat(document.getElementById('eg-val').value)||0;
  g.categoria=document.getElementById('eg-cat').value;
  g.data_iso=document.getElementById('eg-data').value;
  saveS();fecharSheet();renderGastos();toast('✓ Gasto atualizado!');
}

function deletarGasto(id){
  if(!confirm('Excluir este lançamento?'))return;
  S.gastos=S.gastos.filter(x=>x.id!==id);
  saveS();fecharSheet();renderGastos();toast('🗑 Excluído');
}

  document.getElementById('fixos-lista').innerHTML=S.fixos.length===0
    ?`<div style="text-align:center;padding:16px;color:var(--sub);font-size:.82rem">Nenhum gasto fixo. Adicione aluguel, plano de saúde, etc.</div>`
    :S.fixos.map(f=>`
      <div class="list-item" onclick="editarFixo('${f.id}')">
        <div class="list-ico" style="background:rgba(59,130,246,.1)">📌</div>
        <div class="list-info">
          <div class="list-title">${f.nome}</div>
          <div class="list-sub">Vence dia ${f.venc||'—'} · ${pct(f.valor,totalRec)}% da receita</div>
        </div>
        <div class="list-right neg">${fm(f.valor)}</div>
      </div>`).join('');
  document.getElementById('fixos-total').textContent=`Total fixos: ${fm(totalFix)}`;

  document.getElementById('receitas-lista').innerHTML=S.receitas.length===0
    ?`<div style="text-align:center;padding:16px;color:var(--sub);font-size:.82rem">Nenhuma receita. Adicione salário, plantões, etc.</div>`
    :S.receitas.map(r=>`
      <div class="list-item" onclick="editarReceita('${r.id}')">
        <div class="list-ico" style="background:rgba(34,197,94,.1)">💵</div>
        <div class="list-info">
          <div class="list-title">${r.nome}</div>
          <div class="list-sub">${r.recorrente?'🔁 Recorrente':'Pontual'}</div>
        </div>
        <div class="list-right pos">${fm(r.valor)}</div>
      </div>`).join('');
  document.getElementById('receitas-total').textContent=`Total receitas: ${fm(totalRec)}`;
}

/* ═══════ PROJEÇÃO ═══════ */
function renderProjecao(){
  const totalRec=S.receitas.reduce((a,r)=>a+r.valor,0);
  const totalFix=S.fixos.reduce((a,f)=>a+f.valor,0);
  const totalInv=S.investimentos.reduce((a,i)=>a+(i.aporte_mensal||0),0);

  // Média de gastos variáveis (últimos 3 meses)
  const mediaVar=calcMediaVar(3);
  const projecaoGasto=totalFix+mediaVar+totalInv;
  const projecaoSaldo=totalRec-projecaoGasto;

  // Dados dos últimos 6 meses para gráfico
  const historicoMeses=Array.from({length:6},(_,i)=>{
    const d=new Date();d.setMonth(d.getMonth()-5+i);
    const m=d.getMonth(),a=d.getFullYear();
    const{totalGastos,totalRec:rec}=calcMes(m,a);
    return{label:MESES_SHORT[m],gastos:totalGastos,receita:rec,mes:m,ano:a};
  });
  const maxVal=Math.max(...historicoMenses().map(h=>Math.max(h.gastos,h.receita)),totalRec)||1;

  document.getElementById('proj-wrap').innerHTML=`
    <div class="proj-card">
      <div class="proj-label">📈 Projeção para ${MESES_FULL[mesAtual()]}</div>
      <div class="proj-item"><div class="proj-nome">Receita esperada</div><div class="proj-val" style="color:var(--grn)">${fm(totalRec)}</div></div>
      <div class="proj-item"><div class="proj-nome">Gastos fixos</div><div class="proj-val" style="color:var(--pink)">${fm(totalFix)}</div></div>
      <div class="proj-item"><div class="proj-nome">Variáveis (média 3m)</div><div class="proj-val" style="color:var(--pink)">${fm(mediaVar)}</div></div>
      <div class="proj-item"><div class="proj-nome">Investimentos</div><div class="proj-val" style="color:var(--blu)">${fm(totalInv)}</div></div>
      <div style="height:1px;background:var(--bdr);margin:10px 0"></div>
      <div class="proj-item">
        <div class="proj-nome" style="font-weight:700">Saldo projetado</div>
        <div class="proj-val" style="color:${projecaoSaldo>=0?'var(--grn)':'var(--pink)'};font-size:1rem">${fm(projecaoSaldo)}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📊 Histórico 6 meses</div>
      <div style="display:flex;gap:4px;margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:4px;font-size:.7rem;color:var(--sub)"><div style="width:10px;height:10px;border-radius:2px;background:var(--grn)"></div>Receita</div>
        <div style="display:flex;align-items:center;gap:4px;font-size:.7rem;color:var(--sub);margin-left:12px"><div style="width:10px;height:10px;border-radius:2px;background:var(--pink)"></div>Gastos</div>
      </div>
      <div class="bar-chart">
        ${historicoMenses().map(h=>`
          <div class="bar-item">
            <div class="bar-fill" style="height:${Math.round(h.receita/maxVal*72)}px;background:rgba(34,197,94,.3)"></div>
            <div class="bar-fill" style="height:${Math.round(h.gastos/maxVal*72)}px;background:rgba(255,45,120,.4);margin-top:-${Math.round(h.receita/maxVal*72)}px;opacity:.8"></div>
            <div class="bar-label">${h.label}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-title">💡 Análise da IA</div>
      <div id="proj-ia">
        <button class="btn btn-ghost" onclick="analisarFinanceiro()" style="margin-bottom:0">🤖 Analisar minha situação financeira</button>
      </div>
    </div>`;
}

function historicoMenses(){
  return Array.from({length:6},(_,i)=>{
    const d=new Date();d.setMonth(d.getMonth()-5+i);
    const m=d.getMonth(),a=d.getFullYear();
    const{totalGastos,totalRec}=calcMes(m,a);
    return{label:MESES_SHORT[m],gastos:totalGastos,receita:totalRec};
  });
}

function calcMediaVar(meses){
  const totais=Array.from({length:meses},(_,i)=>{
    const d=new Date();d.setMonth(d.getMonth()-i);
    return calcMes(d.getMonth(),d.getFullYear()).totalVar;
  });
  const soma=totais.reduce((a,v)=>a+v,0);
  return meses>0?soma/meses:0;
}

/* ═══════ IA ═══════ */
async function callClaude(prompt,system){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,system,
        messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    return d.content?.[0]?.text||'';
  }catch(e){return null;}
}

function fm(v){return 'R$\u00a0'+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});}
function pct(a,b){return b>0?Math.min(100,Math.round(a/b*100)):0;}

const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function hojeISO(){return hoje().toISOString().split('T')[0];}

function mudarTab(t){
  tabAtual=t;
  document.querySelectorAll('.pg-tab').forEach(p=>p.classList.remove('act'));

/* ═══════ FAB ═══════ */
let fabOpen=false;
function toggleFab(){
  fabOpen=!fabOpen;
  const btn=document.getElementById('fab-btn');
  btn.textContent=fabOpen?'✕':'＋';
  btn.style.transform=fabOpen?'rotate(45deg)':'';
  ['fm-manual','fm-ia','fm-img'].forEach((id,i)=>{
    setTimeout(()=>document.getElementById(id)?.classList.toggle('show',fabOpen),i*50);

}
function fecharFab(){
  fabOpen=false;
  document.getElementById('fab-btn').textContent='＋';
  document.getElementById('fab-btn').style.transform='';
  ['fm-manual','fm-ia','fm-img'].forEach(id=>document.getElementById(id)?.classList.remove('show'));
}

function detectarSimilares(){
  const pendentes=S.desejos.filter(d=>!d.comprado);
  const pares=[];
  for(let i=0;i<pendentes.length;i++){
    for(let j=i+1;j<pendentes.length;j++){
      if(pendentes[i].categoria===pendentes[j].categoria){
        const sim=calcSimilaridade(pendentes[i].nome,pendentes[j].nome);
        if(sim>0.4) pares.push([pendentes[i],pendentes[j]]);
      }
    }
  }
  return pares.slice(0,3);
}

function calcSimilaridade(a,b){
  const wa=a.toLowerCase().split(/\s+/);
  const wb=b.toLowerCase().split(/\s+/);
  const comuns=wa.filter(w=>wb.includes(w)&&w.length>3).length;
  return comuns/Math.max(wa.length,wb.length);
}

function buildDesejoCard(d,similares){
  const cat=CATEGORIAS[d.categoria]||{ic:'🎁',label:'Outros',cor:'var(--sub)'};
  const ehSimilar=similares.some(p=>p[0].id===d.id||p[1].id===d.id);
  const reservado=d.reservado||0;
  const pctRes=pct(reservado,d.preco_estimado||1);

  return `
    <div class="desejo-card ${ehSimilar?'similar-alert':''}" id="dc-${d.id}">
      ${ehSimilar?'<div class="similar-tag">⚠️ Similar</div>':''}
      ${d.imagem
        ?`<img class="desejo-img" src="${d.imagem}" alt="${d.nome}" onclick="verDetalhes('${d.id}')">`
        :`<div class="desejo-img-placeholder" onclick="verDetalhes('${d.id}')">${cat.ic}</div>`}
      <div class="desejo-body">
        <div class="desejo-cat-badge" style="color:${cat.cor};border-color:${cat.cor}44;background:${cat.cor}11">
          ${cat.ic} ${cat.label}
        </div>
        <div class="desejo-nome">${d.nome}</div>
        <div>
          <span class="desejo-preco">${d.preco_estimado?fm(d.preco_estimado):'Preço não definido'}</span>
          ${d.preco_estimado&&d.ia_estimou?'<span class="desejo-preco-est">~estimado</span>':''}
        </div>
        ${d.onde_comprar?`<div style="font-size:.72rem;color:var(--sub);margin-top:4px">🛒 ${d.onde_comprar}</div>`:''}
        ${d.notas?`<div style="font-size:.72rem;color:var(--sub);margin-top:4px;line-height:1.4">💬 ${d.notas}</div>`:''}
        ${d.preco_estimado?`
          <div class="desejo-meta">
            <div class="desejo-prog"><div class="desejo-prog-fill" style="width:${pctRes}%"></div></div>
            <div class="desejo-pct">${pctRes}% guardado</div>
          </div>`:''
        }
        <div class="desejo-actions">
          ${d.link?`<button class="des-btn des-btn-link" onclick="abrirLink('${d.id}')">🔗 Ver</button>`:''}
          <button class="des-btn des-btn-edit" onclick="editarDesejo('${d.id}')">✏️</button>
          <button class="des-btn des-btn-comprar" onclick="marcarComprado('${d.id}')">✓ Comprei</button>
          <button class="des-btn des-btn-del" onclick="deletarDesejo('${d.id}')">🗑</button>
        </div>
      </div>
    </div>`;
}

/* ═══════ RENDER RESUMO ═══════ */
function renderResumo(){
  const pendentes=S.desejos.filter(d=>!d.comprado);
  const comprados=S.desejos.filter(d=>d.comprado);
  const totalPend=pendentes.reduce((a,d)=>a+(d.preco_estimado||0),0);
  const totalComp=comprados.reduce((a,d)=>a+(d.preco_estimado||0),0);

  const porCat={};
  pendentes.forEach(d=>{porCat[d.categoria]=(porCat[d.categoria]||0)+(d.preco_estimado||0);});
  const catsSorted=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=catsSorted[0]?.[1]||1;

  document.getElementById('resumo-wrap').innerHTML=`
    <div class="sum-grid">
      <div class="sum-card o">
        <div class="sum-label">Na lista</div>
        <div class="sum-val">${fm(totalPend)}</div>
        <div class="sum-sub">${pendentes.length} itens</div>
      </div>
      <div class="sum-card g">
        <div class="sum-label">Realizados</div>
        <div class="sum-val">${fm(totalComp)}</div>
        <div class="sum-sub">${comprados.length} itens</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📊 Por Categoria</div>
      ${catsSorted.map(([cat,val])=>{
        const c=CATEGORIAS[cat]||{ic:'🎁',label:cat,cor:'var(--sub)'};
        return `<div class="prog-wrap">
          <div class="prog-top">
            <span class="prog-label">${c.ic} ${c.label}</span>
            <span class="prog-val">${fm(val)}</span>
          </div>
          <div class="prog-track">
            <div class="prog-fill" style="width:${pct(val,maxCat)}%;background:${c.cor}"></div>
          </div>
        </div>`;
      }).join('')||'<div style="color:var(--sub);font-size:.82rem">Nenhum item na lista.</div>'}
    </div>

    <div class="card">
      <div class="card-title">💰 Integração Financeira</div>
      <div style="font-size:.82rem;line-height:1.8;color:var(--sub)">
        <div>📋 Lista total: <strong style="color:var(--txt)">${fm(totalPend)}</strong></div>
        <div>✅ Já realizado: <strong style="color:var(--grn)">${fm(totalComp)}</strong></div>
        <div style="margin-top:8px;font-size:.78rem">💡 Para incluir um desejo no seu planejamento financeiro, edite o item e defina quanto já guardou para ele.</div>
      </div>
      <button class="btn btn-ia" onclick="analisarDesejos()" style="margin-top:10px;margin-bottom:0">🤖 Analisar prioridades com IA</button>
    </div>`;
}

/* ═══════ AÇÕES ═══════ */
function marcarComprado(id){
  const d=S.desejos.find(x=>x.id===id);
  if(!d)return;
  d.comprado=true;d.data_compra=hojeISO();
  saveS();renderLista();toast(`✅ "${d.nome}" marcado como comprado!`);
}

function desmarcarComprado(id){
  const d=S.desejos.find(x=>x.id===id);
  if(!d)return;
  d.comprado=false;delete d.data_compra;
  saveS();renderComprados();toast('↩ Item devolvido à lista');
}

function deletarDesejo(id){
  if(!confirm('Remover este item?'))return;
  S.desejos=S.desejos.filter(x=>x.id!==id);
  saveS();renderLista();toast('🗑 Removido');
}

function abrirLink(id){
  const d=S.desejos.find(x=>x.id===id);
  if(d?.link) window.open(d.link,'_blank');
}

function salvarDesejo(extra={}){
  const nome=document.getElementById('nd-nome')?.value?.trim()||extra.nome||'';
  if(!nome){toast('⚠️ Informe o nome do produto');return;}
  const desejo={
    id:uid(),nome,
    categoria:document.getElementById('nd-cat')?.value||extra.categoria||'outros',
    preco_estimado:parseFloat(document.getElementById('nd-preco')?.value||extra.preco||0)||null,
    onde_comprar:document.getElementById('nd-onde')?.value||extra.onde||'',
    link:document.getElementById('nd-link')?.value||extra.link||'',
    reservado:parseFloat(document.getElementById('nd-res')?.value||0)||0,
    notas:document.getElementById('nd-notas')?.value||extra.notas||'',
    ia_estimou:extra.ia_estimou||false,
    ia_analise:extra.ia_analise||'',
    imagem:extra.imagem||'',
    comprado:false,
    data_criacao:hojeISO(),
  };
  S.desejos.push(desejo);
  saveS();fecharSheet();renderLista();
  toast(`✓ "${nome}" adicionado!`);
  // verificar similares
  const similares=detectarSimilares();
  if(similares.some(p=>p[0].id===desejo.id||p[1].id===desejo.id)){
    setTimeout(()=>toast('⚠️ Item similar detectado na lista!'),1500);
  }
}

const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function hoje(){return new Date();}
function hojeISO(){return hoje().toISOString().split('T')[0];}
function hojeStr(){const d=hoje();return `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`;}
function dataRelativa(iso){
  const diff=Math.round((hoje()-new Date(iso+'T12:00:00'))/864e5);
  if(diff===0)return 'hoje';if(diff===1)return 'ontem';if(diff<7)return `${diff} dias atrás`;
  if(diff<30)return `${Math.round(diff/7)} sem. atrás`;return `${Math.round(diff/30)} meses atrás`;
}

  let lista=S.aprendizados.filter(a=>{
    if(catFiltro!=='todas'&&a.categoria!==catFiltro)return false;
    if(busca&&!a.titulo?.toLowerCase().includes(busca)&&!a.resumo?.toLowerCase().includes(busca)&&!(a.tags||[]).some(t=>t.toLowerCase().includes(busca)))return false;
    return true;
  }).sort((a,b)=>b.data_iso.localeCompare(a.data_iso));

  if(lista.length===0){
    document.getElementById('feed-lista').innerHTML=`
      <div style="text-align:center;padding:40px 16px;color:var(--sub)">
        <div style="font-size:3rem;margin-bottom:12px">🧠</div>
        <div style="font-size:.9rem;font-weight:600;margin-bottom:6px">${busca||catFiltro!=='todas'?'Nenhum resultado':'Banco vazio'}</div>
        <div style="font-size:.8rem;line-height:1.6">${busca||catFiltro!=='todas'?'Tente outro filtro ou busca.':'Registre prints do Instagram, textos ou insights de voz.<br>A IA resume e categoriza tudo.'}</div>
      </div>`;
    return;
  }

  // Agrupar por data relativa
  const grupos={};
  lista.forEach(a=>{
    const dr=dataRelativa(a.data_iso);
    if(!grupos[dr])grupos[dr]=[];
    grupos[dr].push(a);
  });

  document.getElementById('feed-lista').innerHTML=Object.entries(grupos).map(([data,itens])=>`
    <div class="sec-title">${data}</div>
    ${itens.map(a=>buildCard(a)).join('')}
  `).join('');
}

function buildCard(a){
  const cat=CATEGORIAS[a.categoria]||{ic:'📝',label:'Outros',cor:'var(--sub)'};
  return `
    <div class="apr-card ${a.favorito?'favorito':''}" onclick="verDetalhe('${a.id}')">
      <button class="apr-fav" onclick="event.stopPropagation();toggleFav('${a.id}')">${a.favorito?'⭐':'☆'}</button>
      ${a.imagem?`<img class="apr-thumb" src="${a.imagem}" alt="">`
        :`<div class="apr-thumb-placeholder">${cat.ic}</div>`}
      <div class="apr-body">
        <div class="apr-cat-row">
          <div class="apr-cat-badge" style="color:${cat.cor};border-color:${cat.cor}44;background:${cat.cor}11">
            ${cat.ic} ${cat.label}
          </div>
          <span style="font-size:.65rem;color:var(--sub);margin-left:auto">${dataRelativa(a.data_iso)}</span>
        </div>
        <div class="apr-titulo">${a.titulo}</div>
        <div class="apr-resumo">${a.resumo}</div>
        ${a.tags?.length?`<div class="apr-tags">${a.tags.slice(0,4).map(t=>`<span class="apr-tag">#${t}</span>`).join('')}</div>`:''}
      </div>
    </div>`;
}

/* ═══════ RENDER RESUMO ═══════ */
function renderResumo(){
  const total=S.aprendizados.length;
  const mes=S.aprendizados.filter(a=>{
    const d=new Date(a.data_iso+'T12:00:00');
    return d.getMonth()===hoje().getMonth()&&d.getFullYear()===hoje().getFullYear();
  }).length;
  const semana=S.aprendizados.filter(a=>(hoje()-new Date(a.data_iso+'T12:00:00'))/864e5<7).length;

  const porCat={};
  S.aprendizados.forEach(a=>{porCat[a.categoria]=(porCat[a.categoria]||0)+1;});
  const catsSorted=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=catsSorted[0]?.[1]||1;

  const todasTags={};
  S.aprendizados.forEach(a=>(a.tags||[]).forEach(t=>{todasTags[t]=(todasTags[t]||0)+1;}));
  const tagsSorted=Object.entries(todasTags).sort((a,b)=>b[1]-a[1]).slice(0,10);

  document.getElementById('resumo-wrap').innerHTML=`
    <div class="sum-grid">
      <div class="sum-card p">
        <div class="sum-label">Total</div>
        <div class="sum-val">${total}</div>
        <div class="sum-sub">insights salvos</div>
      </div>
      <div class="sum-card c">
        <div class="sum-label">Este mês</div>
        <div class="sum-val">${mes}</div>
        <div class="sum-sub">${semana} esta semana</div>
      </div>
      <div class="sum-card y">
        <div class="sum-label">Favoritos</div>
        <div class="sum-val">${S.aprendizados.filter(a=>a.favorito).length}</div>
        <div class="sum-sub">mais relevantes</div>
      </div>
      <div class="sum-card g">
        <div class="sum-label">Categorias</div>
        <div class="sum-val">${Object.keys(porCat).length}</div>
        <div class="sum-sub">áreas</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📊 Por Categoria</div>
      ${catsSorted.length===0?`<div style="color:var(--sub);font-size:.82rem">Nenhum registro ainda.</div>`:
        catsSorted.map(([cat,cnt])=>{
          const c=CATEGORIAS[cat]||{ic:'📝',label:cat,cor:'var(--sub)'};
          return `<div class="prog-wrap">
            <div class="prog-top">
              <span class="prog-label">${c.ic} ${c.label}</span>
              <span class="prog-val">${cnt}</span>
            </div>
            <div class="prog-track">
              <div class="prog-fill" style="width:${Math.round(cnt/maxCat*100)}%;background:${c.cor}"></div>
            </div>
          </div>`;
        }).join('')}
    </div>

    ${tagsSorted.length>0?`
    <div class="card">
      <div class="card-title">🏷 Tags mais usadas</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${tagsSorted.map(([t,cnt])=>`
          <div style="background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.25);border-radius:999px;
            padding:5px 12px;font-size:.73rem;font-weight:700;color:var(--pur);cursor:pointer"
            onclick="filtrarTag('${t}')">#${t} <span style="color:var(--sub)">${cnt}</span></div>
        `).join('')}
      </div>
    </div>`:''}

    <div class="card">
      <div class="card-title">🤖 Síntese da IA</div>
      <div id="sintese-wrap">
        <div style="font-size:.8rem;color:var(--sub);margin-bottom:10px">A IA pode gerar uma síntese dos seus principais aprendizados do mês.</div>
        <button class="btn-ghost" onclick="gerarSintese()" style="width:100%;padding:11px;border-radius:12px;border:1px solid var(--bdr);color:var(--txt);font-family:'Space Grotesk',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;background:transparent">🤖 Gerar síntese do mês</button>

async function processarImagemAPR(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async(e)=>{
    const base64=e.target.result;
    const base64data=base64.split(',')[1];
    const mediaType=file.type||'image/jpeg';

    document.getElementById('sheet-content').innerHTML=`
      <div class="sheet-title">🤖 Lendo imagem...</div>
      <img src="${base64}" style="width:100%;height:160px;object-fit:cover;border-radius:12px;margin-bottom:14px">
      <div class="ia-bubble jarvis">⏳ Extraindo e resumindo o conteúdo da imagem...</div>`;

    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,
          system:`Você é um assistente de aprendizado. Analise a imagem e responda APENAS em JSON válido sem markdown.
Formato:
{
  "titulo": "título curto e descritivo (máx 60 chars)",
  "resumo": "resumo claro em 2-3 frases do que foi aprendido",
  "pontos_principais": ["ponto 1","ponto 2","ponto 3"],
  "aplicacao_pratica": "como isso pode ser aplicado na vida do usuário",
  "categoria": "medicina|produtividade|financas|saude|tecnologia|comportamento|lideranca|idiomas|outros",
  "tags": ["tag1","tag2","tag3"]
}`,
          messages:[{role:'user',content:[
            {type:'image',source:{type:'base64',media_type:mediaType,data:base64data}},
            {type:'text',text:'Analise o conteúdo desta imagem e extraia os aprendizados principais. Retorne em JSON.'}
          ]}]})});
      const data=await resp.json();
      const txt=data.content?.[0]?.text||'';
      const obj=JSON.parse(txt.replace(/```json|```/g,'').trim());
      mostrarConfirmacao(obj,{imagem:base64,tipo:'imagem'});
    }catch(err){
      document.getElementById('sheet-content').innerHTML=`
        <div class="sheet-title">⚠️ Não consegui ler</div>
        <img src="${base64}" style="width:100%;height:120px;object-fit:cover;border-radius:12px;margin-bottom:14px">
        <div class="ia-bubble jarvis">A imagem pode estar sem texto legível. Tente colar o texto manualmente.</div>
        <button class="btn btn-ghost" onclick="fecharSheet();abrirAddTexto()">✏️ Adicionar texto</button>
        <button class="btn btn-ghost" onclick="fecharSheet()">Cancelar</button>`;
    }
  };
  reader.readAsDataURL(file);
}

/* ═══════ ADD POR VOZ ═══════ */
function abrirAddVoz(){
  fecharFab();
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    toast('⚠️ Voz não suportada. Use o Safari.');
    abrirAddTexto();return;
  }

  document.getElementById('sheet-content').innerHTML=`
    <div class="sheet-title">🎤 Falar para registrar</div>
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:3rem;margin-bottom:12px;animation:pulse 1.5s ease-in-out infinite">🎤</div>
      <div style="font-weight:700;font-size:.9rem;margin-bottom:6px" id="voz-status">Ouvindo...</div>
      <div style="font-size:.78rem;color:var(--sub)">Fale o que você aprendeu</div>
      <div id="voz-transcript" style="margin-top:14px;font-size:.84rem;color:var(--txt);min-height:40px;line-height:1.6"></div>
    </div>
    <button class="btn btn-danger" id="voz-parar" onclick="pararVoz()">⏹ Parar</button>`;
  document.getElementById('overlay').classList.add('open');

  const r=new SpeechRecognition();
  r.lang='pt-BR';r.continuous=true;r.interimResults=true;
  window._recognitionAPR=r;

  r.onresult=(e)=>{
    const txt=Array.from(e.results).map(x=>x[0].transcript).join('');
    const el=document.getElementById('voz-transcript');
    if(el)el.textContent=txt;
  };
  r.onend=()=>{
    const txt=document.getElementById('voz-transcript')?.textContent||'';
    if(txt.length>5){
      document.getElementById('voz-status').textContent='Analisando...';
      processarVozIA(txt);
    } else {
      toast('⚠️ Não ouvi nada. Tente novamente.');fecharSheet();
    }
  };
  r.onerror=()=>{fecharSheet();toast('⚠️ Erro no microfone.');};
  r.start();
}

function pararVoz(){window._recognitionAPR?.stop();}

async function processarVozIA(texto){
  document.getElementById('sheet-content').innerHTML=`
    <div class="sheet-title">🤖 Processando...</div>
    <div class="ia-bubble jarvis">⏳ Organizando o que você falou...</div>`;
  const res=await processarConteudoIA(texto,'voz','outros');
  if(res) mostrarConfirmacao(res,{texto,tipo:'voz'});
  else{fecharSheet();toast('⚠️ Sem conexão com IA.');}
}

/* ═══════ IA CORE ═══════ */
async function processarConteudoIA(conteudo,tipo,catSugerida){
  const system=`Você é um assistente de aprendizado pessoal do Dr. Antonio Roberto, médico em SP.
Analise o conteúdo e responda APENAS em JSON válido sem markdown.
Formato:
{
  "titulo": "título curto e impactante (máx 60 chars)",
  "resumo": "resumo claro em 2-3 frases do aprendizado principal",
  "pontos_principais": ["ponto 1 objetivo","ponto 2 objetivo","ponto 3 objetivo"],
  "aplicacao_pratica": "como isso se aplica à vida de um médico com rotina intensa",
  "categoria": "${catSugerida||'outros'}",
  "tags": ["tag1","tag2","tag3","tag4"]
}`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system,
        messages:[{role:'user',content:`Tipo de entrada: ${tipo}. Conteúdo:\n\n${conteudo}`}]})});
    const d=await r.json();
    const txt=d.content?.[0]?.text||'';

async function callClaude(prompt,system){

      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system,
        messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    return d.content?.[0]?.text||'';
  }catch(e){return null;}
}

}

function salvarMeta(id){
  const nome=document.getElementById('em-nome').value.trim();
  if(!nome){toast('⚠️ Informe o nome');return;}
  const dados={
    ic:document.getElementById('em-ic').value||'🎯',
    nome,area:document.getElementById('em-area').value,
    prazo:document.getElementById('em-prazo').value,
    indicador:document.getElementById('em-ind').value,
    progresso:parseInt(document.getElementById('em-prog').value)||0,
    status:'ativa',
  };
  if(id){
    const m=S.metas.find(x=>x.id===id);
    if(m) Object.assign(m,dados);
  } else {
    dados.id=uid();dados.cascata=[];
    S.metas.push(dados);
  }
  saveS();fecharSheet();renderMetas();toast('✓ Meta salva!');

  document.getElementById('manutencao-lista').innerHTML=S.manutencao.length===0
    ?`<div style="font-size:.8rem;color:var(--sub)">Nenhum item de manutenção.</div>`

        </div>
        <div class="list-right">${m.status==='feito'?'✅':'⏳'}</div>
      </div>`).join('');

function toggleRotina(tipo,id){
  const r=(S.rotinas[tipo]||[]).find(x=>x.id===id);
  if(r){r.done=!r.done;saveS();renderCasa();}
}

function resetRotinas(tipo){
  (S.rotinas[tipo]||[]).forEach(r=>r.done=false);
  saveS();renderCasa();toast('↺ Rotinas resetadas');
}

function renderDocs(){
  const alertas=S.docs.filter(d=>{
    if(!d.vencimento)return false;
    const dias=diasAte(d.vencimento);
    return dias!==null&&dias<=30&&dias>=0;
  });

  document.getElementById('docs-alertas').innerHTML=alertas.length?`
    <div class="card" style="margin-bottom:12px;border-color:rgba(255,45,120,.3);background:rgba(255,45,120,.04)">
      <div class="card-title" style="color:var(--pink)">⚠️ Vencendo em breve</div>
      ${alertas.map(d=>`
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bdr);font-size:.84rem">
          <span>${d.nome}</span>
          <span style="font-weight:700;color:${diasAte(d.vencimento)<=7?'var(--pink)':'var(--yel)'}">${diasAte(d.vencimento)}d</span>
        </div>`).join('')}
    </div>`:'';

  document.getElementById('docs-lista').innerHTML=S.docs.map(d=>{
    const dias=d.vencimento?diasAte(d.vencimento):null;
    const cls=dias===null?'':dias<0?'ok':dias<=7?'crit':dias<=30?'warn':'ok';
    return `<div class="doc-item ${cls}" onclick="editarDoc('${d.id}')">
      <div class="doc-ic">${docIc(d.nome)}</div>
      <div class="doc-info">
        <div class="doc-nome">${d.nome}</div>
        <div class="doc-venc" style="color:${dias===null?'var(--sub)':dias<0?'var(--grn)':dias<=7?'var(--pink)':dias<=30?'var(--yel)':'var(--sub)'}">
          ${d.vencimento?`${dias!==null&&dias<0?'✓ Ok':'Vence'} ${dataFmt(d.vencimento)} (${dias!==null?dias<0?'em dia':dias+'d':'—'})`:d.obs||'Sem data cadastrada'}
        </div>
      </div>
      <div style="font-size:.9rem">${dias===null?'➕':dias<0?'✅':dias<=7?'🔴':dias<=30?'🟡':'🟢'}</div>
    </div>`;
  }).join('');
}

function docIc(nome){
  const map={RG:'🪪',CNH:'🚗',CRM:'🏥',Passaporte:'🛂',IPVA:'🚙','Seguro do carro':'🛡️','Plano de saúde':'💊'};
  return map[nome]||'📄';
}

function iniciarRevisao(tipo){
  const perguntas=PERGUNTAS[tipo]||PERGUNTAS.diaria;
  let idx=0;const respostas=[];
  function mostrar(){
    if(idx>=perguntas.length){
      const rev={id:uid(),tipo,data:new Date().toLocaleDateString('pt-BR'),respostas};
      S.revisoes.push(rev);saveS();fecharSheet();renderRevisoes();
      toast(`✅ Revisão ${tipo} concluída!`);return;
    }
    const q=perguntas[idx];
    document.getElementById('sheet-content').innerHTML=`
      <div class="sheet-title">${q.emoji} Revisão ${tipo.charAt(0).toUpperCase()+tipo.slice(1)}</div>
      <div style="text-align:center;margin-bottom:16px">
        ${perguntas.map((_,i)=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;
          margin:0 3px;background:${i===idx?'var(--cyan)':'var(--bdr)'};transition:.2s"></span>`).join('')}
        <span style="font-size:.72rem;color:var(--sub);margin-left:8px">${idx+1}/${perguntas.length}</span>
      </div>
      <div style="font-size:1rem;font-weight:700;margin-bottom:14px;line-height:1.4">${q.p}</div>
      <textarea class="fi" id="rev-r" rows="4" placeholder="${q.placeholder}" style="resize:none"></textarea>
      <div style="display:grid;grid-template-columns:${idx>0?'1fr 1fr':'1fr'};gap:8px;margin-top:10px">
        ${idx>0?`<button class="btn btn-ghost" style="margin-bottom:0" onclick="idx--;mostrar()">← Voltar</button>`:''}
        <button class="btn btn-primary" style="margin-bottom:0" onclick="
          const v=document.getElementById('rev-r').value;
          respostas[${idx}]={p:'${q.p}',r:v};idx++;mostrar()">
          ${idx===perguntas.length-1?'✅ Concluir':'Próximo →'}
        </button>
      </div>
      <button class="btn btn-ghost" onclick="fecharSheet()" style="margin-top:8px">Cancelar</button>`;
  }
  document.getElementById('overlay').classList.add('open');
  mostrar();
}

/* ═══════ IA ═══════ */
async function callClaude(prompt,system){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system,
        messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    return d.content?.[0]?.text||'';
  }catch(e){return null;}
}

function abrirIAMais(){
  const comprasUrg=S.compras.filter(c=>!c.comprado&&c.prioridade==='urgente').length;
  const docsVenc=S.docs.filter(d=>d.vencimento&&diasAte(d.vencimento)!==null&&diasAte(d.vencimento)>=0&&diasAte(d.vencimento)<=30).length;
  const metasAtivas=S.metas.filter(m=>m.status!=='concluida').length;

  document.getElementById('sheet-content').innerHTML=`
    <div class="sheet-title">🤖 Jarvis — Assistente</div>
    <div style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:12px;
      padding:12px;font-size:.75rem;color:var(--sub);margin-bottom:14px;line-height:1.8">
      🛒 ${comprasUrg} compra${comprasUrg!==1?'s':''} urgente${comprasUrg!==1?'s':''} ·
      📄 ${docsVenc} doc${docsVenc!==1?'s':''} vencendo ·
      🎯 ${metasAtivas} meta${metasAtivas!==1?'s':''} ativa${metasAtivas!==1?'s':''}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${['O que é mais urgente agora?','Resumo da minha semana','Analise minhas metas','O que preciso comprar?'].map(s=>`
        <button onclick="perguntarIAMais('${s}')" style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);color:var(--sub);padding:6px 12px;border-radius:8px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif">${s}</button>`).join('')}
    </div>
    <div id="ia-mais-resp" style="min-height:60px"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input class="fi" id="ia-mais-q" placeholder="Pergunte qualquer coisa..." style="flex:1">
      <button onclick="perguntarIAMais(document.getElementById('ia-mais-q').value)" style="background:var(--g7);border:none;border-radius:12px;padding:0 16px;color:#fff;font-weight:700;cursor:pointer;flex-shrink:0">→</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');
}

async function perguntarIAMais(q){
  if(!q?.trim())return;
  const el=document.getElementById('ia-mais-resp');
  if(el)el.innerHTML=`<div class="ia-bubble jarvis" style="color:var(--sub)">⏳ Pensando...</div>`;

  const comprasUrg=S.compras.filter(c=>!c.comprado&&c.prioridade==='urgente').map(c=>c.nome).join(', ');
  const docsVenc=S.docs.filter(d=>d.vencimento&&diasAte(d.vencimento)>=0&&diasAte(d.vencimento)<=30).map(d=>d.nome+'('+diasAte(d.vencimento)+'d)').join(', ');
  const metas=S.metas.filter(m=>m.status!=='concluida').map(m=>m.nome+'('+m.progresso+'%)').join(', ');
  const ultima=S.revisoes.length?S.revisoes[S.revisoes.length-1]:null;

  const system=`Você é o Jarvis, assistente pessoal do Dr. Antonio Roberto, médico em SP.
Situação atual:
- Compras urgentes: ${comprasUrg||'nenhuma'}
- Documentos vencendo: ${docsVenc||'nenhum'}
- Metas ativas: ${metas||'nenhuma'}
- Última revisão: ${ultima?ultima.tipo+' em '+ultima.data:'nenhuma'}
Responda em português, direto e útil. Máximo 3 parágrafos.`;

  const res=await callClaude(q,system);
  if(el)el.innerHTML=`<div class="ia-bubble jarvis">${res||'⚠️ Sem conexão.'}</div>`;
}

function init(){
  const topbarData=document.getElementById('topbar-data');
  if(topbarData)topbarData.textContent=hojeStr();
  checkDarkMode();
  setInterval(checkDarkMode,60000);
  if(!S.config.onboarding){initOB();}
  else{document.getElementById('onboard').classList.add('hide');rHoje();buscarClima();}
  setSyncDot('ok');

  setTimeout(()=>verificarAlinhamento(),5000);
}

function verificarAlinhamento(){
  const hoje=hojeISO();if(S.ultima_alinhamento===hoje)return;
  const d=agora();const dw=d.getDay();const dm=d.getDate();const h2=d.getHours();
  let pergunta=null;
  if(dw===1&&h2>=7&&h2<=10)pergunta={ic:'📊',titulo:'Check-in semanal',corpo:'Como foi seu fim de semana? Algum ajuste na rotina?'};
  else if(dm===1&&h2>=8)pergunta={ic:'💰',titulo:'Mês novo!',corpo:'Sua renda este mês mudou? Algum gasto extra previsto?'};
  else if(S.treinos.length>0){const diasSemTreino=Math.round((agora()-new Date(S.treinos[S.treinos.length-1].data_iso+'T12:00:00'))/864e5);if(diasSemTreino>=4)pergunta={ic:'💪',titulo:'Ausência no treino',corpo:`Notei que você não treina há ${diasSemTreino} dias. Tudo bem?`};}
  if(pergunta&&h2>=7&&h2<=21){setTimeout(()=>{abrirSheet(`<div class="sheet-title">${pergunta.ic} ${pergunta.titulo}</div><div style="font-size:.88rem;color:var(--sub);line-height:1.7;margin-bottom:16px">${pergunta.corpo}</div><textarea class="textarea-input" id="al-resp" rows="3" placeholder="Resposta..."></textarea><button class="btn btn-primary" onclick="enviarAlinhamento()" style="margin-top:10px">Responder</button><button class="btn btn-outline" onclick="fecharSheet()" style="margin-top:6px">Agora não</button>`);S.ultima_alinhamento=hoje;saveS();},3000);}
}
async function enviarAlinhamento(){const resp=document.getElementById('al-resp')?.value?.trim();fecharSheet();if(resp){const res=await callClaude('Check-in: "'+resp+'"',ctxGlobal()+'\nDê uma resposta útil e encorajadora em 1-2 frases.',300);if(res)setTimeout(()=>toast('🤖 '+res.slice(0,80)),500);}}

init();
