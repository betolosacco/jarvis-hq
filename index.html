<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis HQ">
<meta name="theme-color" content="#07071a">
<title>Jarvis HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Outfit",sans-serif;background:#07071a;color:#f0f0ff;
  height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  max-width:480px;margin:0 auto;padding:24px;}
.logo{font-size:4rem;margin-bottom:16px;animation:bounce .6s ease;}
@keyframes bounce{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
h1{font-size:1.5rem;font-weight:900;background:linear-gradient(135deg,#8b5cf6,#00d4ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
p{font-size:.85rem;color:#8888bb;margin-bottom:32px;text-align:center;line-height:1.6;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-bottom:20px;}
.btn-aba{padding:16px 12px;border-radius:16px;border:1px solid #22224a;background:#111128;
  cursor:pointer;text-align:center;text-decoration:none;color:#f0f0ff;display:flex;
  flex-direction:column;align-items:center;gap:6px;transition:.15s;}
.btn-aba:active{transform:scale(.96);}
.btn-aba .ic{font-size:1.6rem;}
.btn-aba .nm{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#8888bb;}
.btn-hoje{grid-column:1/-1;padding:18px;border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.07);}
.btn-hoje .nm{color:#00d4ff;}
.note{font-size:.72rem;color:#8888bb;text-align:center;line-height:1.6;
  background:#111128;border:1px solid #22224a;border-radius:12px;padding:12px;width:100%;}
</style>
</head>
<body>
<div class="logo">🧠</div>
<h1>JARVIS HQ</h1>
<p>Abra a aba que deseja usar.<br>Salve cada uma na Tela de Início para acesso rápido.</p>

<div class="grid">
  <a class="btn-aba btn-hoje" href="hoje.html">
    <div class="ic">🏠</div>
    <div class="nm">Hoje — Hub Principal</div>
  </a>
  <a class="btn-aba" href="saude.html">
    <div class="ic">💪</div>
    <div class="nm">Saúde</div>
  </a>
  <a class="btn-aba" href="estudos.html">
    <div class="ic">📚</div>
    <div class="nm">Estudos</div>
  </a>
  <a class="btn-aba" href="financas.html">
    <div class="ic">💰</div>
    <div class="nm">Finanças</div>
  </a>
  <a class="btn-aba" href="desejos.html">
    <div class="ic">🛍️</div>
    <div class="nm">Desejos</div>
  </a>
  <a class="btn-aba" href="aprendizado.html">
    <div class="ic">🧠</div>
    <div class="nm">Aprendizado</div>
  </a>
  <a class="btn-aba" href="mais.html">
    <div class="ic">☰</div>
    <div class="nm">Mais</div>
  </a>
</div>

<div class="note">
  💡 <strong>Para usar como app:</strong> Abra <strong>hoje.html</strong> no Safari → 
  Compartilhar → Adicionar à Tela de Início
</div>
</body>
</html>
