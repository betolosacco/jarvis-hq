function sCfg(){S.cfg.nome=document.getElementById('cfg-n').value||S.cfg.nome;S.cfg.peso_meta=parseFloat(document.getElementById('cfg-p').value)||75;S.cfg.sono_meta=parseFloat(document.getElementById('cfg-s').value)||7.5;sv();rMCfg();toast('✓ Salvo!');}
function pedirChave(){abrir('<div class="sh-t">🔑 Ativar IA</div><div style="font-size:.84rem;color:#8888bb;line-height:1.7;margin-bottom:14px">Cole sua chave da Anthropic. Começa com <code style="background:#181835;padding:2px 5px;border-radius:4px">sk-ant-</code></div><div class="fg"><label class="fl">API Key</label><input class="fi" id="ck-i" placeholder="sk-ant-api03-..." type="password" autocomplete="off"></div><button class="btn bp" onclick="sChave()">🔑 Ativar</button><button class="btn bo" onclick="fecharOv()">Cancelar</button>');}
function sChave(){var k=document.getElementById('ck-i').value.trim();if(k&&k.startsWith('sk-')){localStorage.setItem('jv_ck',k);fecharOv();toast('✅ IA ativada!');}else toast('⚠️ Chave inválida — deve começar com sk-');}
function init(){var dt=document.getElementById('top-dt');if(dt)dt.textContent=hojeStr();rHoje();buscarClima();if(!gKey())setTimeout(pedirChave,1500);}
init();
</script>
