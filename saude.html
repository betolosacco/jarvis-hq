<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jarvis — Saúde</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060612;--card:#0d0d1f;--card2:#131328;--bdr:#1e1e3f;
  --cyan:#00f5d4;--pink:#ff2d78;--yel:#ffd60a;--pur:#7c3aed;
  --blu:#3b82f6;--ora:#ff6b2b;--grn:#22c55e;--red:#ef4444;
  --txt:#eeeeff;--sub:#6666aa;--r:16px;
  --g1:linear-gradient(135deg,#00f5d4,#3b82f6);
  --g2:linear-gradient(135deg,#ff2d78,#7c3aed);
  --g3:linear-gradient(135deg,#ffd60a,#ff6b2b);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--txt);
  min-height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 100% 40% at 50% -5%,rgba(34,197,94,.07) 0%,transparent 65%),
             radial-gradient(ellipse 50% 30% at 95% 85%,rgba(0,245,212,.05) 0%,transparent 60%);}

#scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 90px;position:relative;z-index:1;}
#scroll::-webkit-scrollbar{display:none;}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 10px;background:rgba(6,6,18,.95);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:50;}
.tbar-logo{font-weight:800;font-size:1.05rem;letter-spacing:-.02em;
  background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tbar-date{font-size:.72rem;color:var(--sub);font-family:'JetBrains Mono',monospace;margin-top:1px;}
.tbar-btn{width:34px;height:34px;border-radius:11px;border:1px solid var(--bdr);
  background:var(--card2);color:var(--txt);font-size:.95rem;cursor:pointer;display:grid;place-items:center;}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;background:rgba(6,6,18,.97);backdrop-filter:blur(24px);
  border-top:1px solid var(--bdr);display:grid;grid-template-columns:repeat(5,1fr);
  z-index:100;padding-bottom:env(safe-area-inset-bottom,0px);}
.bnav{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:9px 4px 7px;cursor:pointer;border:none;background:transparent;
  color:var(--sub);font-family:'Space Grotesk',sans-serif;font-size:.58rem;font-weight:600;
  gap:3px;text-transform:uppercase;letter-spacing:.05em;}
.bnav.act{color:var(--cyan);}
.bnav-ic{font-size:1.2rem;line-height:1;}

/* TABS INTERNOS */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 16px 0;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--bdr);background:var(--card2);
  font-size:.76rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s;
  color:var(--sub);font-family:'Space Grotesk',sans-serif;}
.tab.act{background:rgba(0,245,212,.1);border-color:rgba(0,245,212,.35);color:var(--cyan);}

/* SECTION */
.sec{padding:14px 16px 0;}
.pg-tab{display:none;}.pg-tab.act{display:block;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.card-title{font-weight:700;font-size:.88rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;}

/* SUMMARY GRID */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.sum-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;
  padding:14px 12px;position:relative;overflow:hidden;cursor:pointer;transition:.15s;}
.sum-card:active{transform:scale(.97);}
.sum-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--c,var(--cyan));}
.sum-card.c{--c:var(--cyan)}.sum-card.g{--c:var(--grn)}.sum-card.y{--c:var(--yel)}.sum-card.p{--c:var(--pur)}.sum-card.o{--c:var(--ora)}
.sum-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--sub);margin-bottom:5px;}
.sum-val{font-weight:800;font-size:1.4rem;letter-spacing:-.03em;font-family:'JetBrains Mono',monospace;}
.sum-sub{font-size:.68rem;color:var(--sub);margin-top:2px;}
.sum-trend{position:absolute;top:10px;right:10px;font-size:.85rem;}

/* PROGRESS */
.prog-wrap{margin-bottom:12px;}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.prog-label{font-size:.8rem;font-weight:600;}
.prog-val{font-size:.75rem;color:var(--sub);font-family:'JetBrains Mono',monospace;}
.prog-track{height:8px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;}
.prog-fill{height:100%;border-radius:999px;transition:width .8s ease;}

/* CHART — peso */
.chart-wrap{height:100px;position:relative;margin:8px 0 14px;}
.chart-svg{width:100%;height:100%;}

/* HEATMAP TREINOS */
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px;}
.hm-cell{aspect-ratio:1;border-radius:5px;background:var(--bdr);cursor:pointer;transition:.15s;position:relative;}
.hm-cell.treino{background:var(--grn);}
.hm-cell.treino-leve{background:rgba(34,197,94,.4);}
.hm-cell:active{transform:scale(.9);}
.hm-label{font-size:.6rem;color:var(--sub);text-align:center;margin-bottom:4px;
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}

/* TREINO CARDS */
.treino-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.treino-card{background:var(--card2);border:1px solid var(--bdr);border-radius:13px;
  padding:12px 8px;text-align:center;cursor:pointer;transition:.15s;}
.treino-card.ativo{border-color:var(--grn);background:rgba(34,197,94,.08);}
.treino-card:active{transform:scale(.95);}
.treino-ic{font-size:1.5rem;margin-bottom:4px;}
.treino-nome{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.treino-cnt{font-size:.65rem;color:var(--sub);margin-top:3px;font-family:'JetBrains Mono',monospace;}

/* SONO STRIP */
.sono-strip{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;}
.sono-strip::-webkit-scrollbar{display:none;}
.sono-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;width:36px;}
.sono-bar-bg{width:12px;height:60px;background:rgba(255,255,255,.06);border-radius:6px;
  position:relative;overflow:hidden;}
.sono-bar-fill{position:absolute;bottom:0;left:0;right:0;border-radius:6px;transition:.6s ease;}
.sono-bar-label{font-size:.6rem;color:var(--sub);font-family:'JetBrains Mono',monospace;}
.sono-bar-dia{font-size:.58rem;color:var(--sub);}

/* REFEICAO */
.refeicao-item{display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--bdr);}
.refeicao-item:last-child{border-bottom:none;}
.ref-time{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--sub);
  flex-shrink:0;width:48px;padding-top:2px;}
.ref-content{flex:1;}
.ref-nome{font-weight:600;font-size:.85rem;}
.ref-macro{font-size:.7rem;color:var(--sub);margin-top:3px;}
.ref-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--bdr);
  flex-shrink:0;display:grid;place-items:center;cursor:pointer;transition:.15s;}
.ref-check.done{background:var(--grn);border-color:var(--grn);color:#fff;}

/* LIST ITEMS */
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bdr);}
.list-item:last-child{border-bottom:none;}
.list-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:1.05rem;flex-shrink:0;}
.list-info{flex:1;min-width:0;}
.list-title{font-weight:600;font-size:.86rem;}
.list-sub{font-size:.71rem;color:var(--sub);margin-top:2px;}
.list-right{font-weight:700;font-size:.9rem;text-align:right;flex-shrink:0;font-family:'JetBrains Mono',monospace;}
.pos{color:var(--grn)}.neg{color:var(--pink)}.neu{color:var(--sub)}

/* FAB */
.fab{position:fixed;bottom:76px;right:calc(50% - 230px);
  width:52px;height:52px;border-radius:50%;border:none;
  background:var(--g1);color:#060612;font-size:1.35rem;
  cursor:pointer;box-shadow:0 4px 24px rgba(0,245,212,.35);
  display:grid;place-items:center;z-index:99;transition:.15s;}
.fab:active{transform:scale(.92);}
@media(max-width:480px){.fab{right:14px;}}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);
  z-index:200;display:none;flex-direction:column;justify-content:flex-end;}
.overlay.open{display:flex;}
.sheet{background:var(--card);border-radius:24px 24px 0 0;border:1px solid var(--bdr);
  border-bottom:none;padding:6px 20px calc(24px + env(safe-area-inset-bottom,0px));
  max-height:92vh;overflow-y:auto;}
.sheet::-webkit-scrollbar{display:none;}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--bdr);margin:10px auto 16px;}
.sheet-title{font-weight:800;font-size:1.05rem;margin-bottom:18px;text-align:center;}

/* FORM */
.fg{margin-bottom:14px;}
.fl{display:block;font-size:.7rem;font-weight:700;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.07em;}
.fi{width:100%;background:var(--card2);border:1px solid var(--bdr);border-radius:12px;
  padding:12px 14px;color:var(--txt);font-family:'Space Grotesk',sans-serif;font-size:.9rem;outline:none;transition:.15s;}
.fi:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,245,212,.1);}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
select.fi{appearance:none;cursor:pointer;}
textarea.fi{resize:none;line-height:1.5;}

/* BOTOES */
.btn{width:100%;padding:13px;border-radius:13px;border:none;cursor:pointer;
  font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:700;margin-bottom:8px;transition:.15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--g1);color:#060612;}
.btn-ghost{background:transparent;border:1px solid var(--bdr);color:var(--txt);}
.btn-danger{background:rgba(255,45,120,.1);border:1px solid rgba(255,45,120,.3);color:var(--pink);}
.btn-grn{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:var(--grn);}

/* IA BUBBLE */
.ia-bubble{padding:10px 14px;border-radius:14px;font-size:.84rem;line-height:1.6;margin-bottom:8px;}
.ia-bubble.jarvis{background:rgba(123,58,237,.1);border:1px solid rgba(123,58,237,.2);border-radius:14px 14px 14px 4px;}
.ia-loading{color:var(--sub);font-style:italic;}

/* TOAST */
.toast{position:fixed;bottom:98px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--card2);border:1px solid var(--bdr);border-radius:12px;
  padding:10px 18px;font-size:.82rem;font-weight:600;opacity:0;transition:.25s;
  z-index:300;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.divider{height:1px;background:var(--bdr);margin:14px 0;}
.sec-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--sub);
  margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--bdr);}
.spacer{height:12px;}

/* MACROS BAR */
.macro-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0;}
.macro-box{background:var(--card2);border:1px solid var(--bdr);border-radius:11px;
  padding:10px 8px;text-align:center;}
.macro-val{font-weight:800;font-size:1rem;font-family:'JetBrains Mono',monospace;}
.macro-label{font-size:.65rem;color:var(--sub);margin-top:2px;text-transform:uppercase;letter-spacing:.05em;}

/* PESO META */
.meta-card{background:linear-gradient(135deg,rgba(0,245,212,.08),rgba(59,130,246,.06));
  border:1px solid rgba(0,245,212,.2);border-radius:14px;padding:16px;margin-bottom:12px;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="tbar-logo">💪 Saúde</div>
    <div class="tbar-date" id="tbar-date">—</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="tbar-btn" onclick="abrirIA()">🤖</button>
  </div>
</div>

<!-- TABS INTERNOS -->
<div class="tabs">
  <button class="tab act" onclick="mudarTab('peso')" id="tab-peso">⚖️ Peso</button>
  <button class="tab" onclick="mudarTab('treinos')" id="tab-treinos">💪 Treinos</button>
  <button class="tab" onclick="mudarTab('sono')" id="tab-sono">😴 Sono</button>
  <button class="tab" onclick="mudarTab('nutricao')" id="tab-nutricao">🥗 Nutrição</button>
</div>

<div id="scroll">
  <div class="sec">

    <!-- ══ PESO ══ -->
    <div class="pg-tab act" id="pg-peso">
      <div class="spacer"></div>
      <div id="peso-summary"></div>
      <div class="card">
        <div class="card-title">📈 Evolução do Peso
          <button onclick="abrirRegistroPeso()" style="margin-left:auto;background:rgba(0,245,212,.08);border:1px solid rgba(0,245,212,.2);color:var(--cyan);padding:4px 10px;border-radius:8px;font-size:.7rem;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif">+ Registrar</button>
        </div>
        <div class="chart-wrap"><canvas id="peso-chart" style="width:100%;height:100px"></canvas></div>
        <div id="peso-historico"></div>
      </div>
      <div class="card">
        <div class="card-title">🎯 Meta de Peso</div>
        <div id="peso-meta-wrap"></div>
      </div>
    </div>

    <!-- ══ TREINOS ══ -->
    <div class="pg-tab" id="pg-treinos">
      <div class="spacer"></div>
      <div id="treinos-summary"></div>
      <div class="card">
        <div class="card-title">📅 Últimas 4 semanas</div>
        <div class="hm-label" id="hm-dias"></div>
        <div class="heatmap" id="heatmap"></div>
        <div style="display:flex;gap:12px;font-size:.7rem;color:var(--sub)">
          <span>⬜ Sem treino</span>
          <span style="color:rgba(34,197,94,.5)">▪ Leve</span>
          <span style="color:var(--grn)">▪ Completo</span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">🏃 Modalidades
          <button onclick="abrirRegistroTreino()" style="margin-left:auto;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:var(--grn);padding:4px 10px;border-radius:8px;font-size:.7rem;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif">+ Registrar</button>
        </div>
        <div class="treino-grid" id="treino-grid"></div>
      </div>
      <div class="card">
        <div class="card-title">📋 Últimos Treinos</div>
        <div id="treinos-lista"></div>
      </div>
      <div class="card" id="planos-treino-card">
        <div class="card-title">📄 Planos de Treino</div>
        <div id="planos-lista"></div>
        <button class="btn btn-ghost" onclick="gerarPlanoTreino()" style="margin-bottom:0;margin-top:8px">🤖 Gerar plano com IA</button>
      </div>
    </div>

    <!-- ══ SONO ══ -->
    <div class="pg-tab" id="pg-sono">
      <div class="spacer"></div>
      <div id="sono-summary"></div>
      <div class="card">
        <div class="card-title">😴 Últimos 7 dias
          <button onclick="abrirRegistroSono()" style="margin-left:auto;background:rgba(123,58,237,.08);border:1px solid rgba(123,58,237,.2);color:var(--pur);padding:4px 10px;border-radius:8px;font-size:.7rem;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif">+ Registrar</button>
        </div>
        <div class="sono-strip" id="sono-strip"></div>
        <div id="sono-historico"></div>
      </div>
      <div class="card">
        <div class="card-title">💡 Análise do Sono</div>
        <div id="sono-analise"></div>
      </div>
    </div>

    <!-- ══ NUTRICAO ══ -->
    <div class="pg-tab" id="pg-nutricao">
      <div class="spacer"></div>
      <div id="nutri-summary"></div>
      <div class="card">
        <div class="card-title">🥗 Plano Alimentar
          <span id="nutri-status" style="margin-left:auto;font-size:.72rem;color:var(--sub)"></span>
        </div>
        <div id="plano-wrap"></div>
      </div>
      <div class="card" id="registro-dia-card">
        <div class="card-title">✅ Execução de Hoje
          <button onclick="abrirRegistroRefeicao()" style="margin-left:auto;background:rgba(255,214,10,.08);border:1px solid rgba(255,214,10,.2);color:var(--yel);padding:4px 10px;border-radius:8px;font-size:.7rem;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif">+ Refeição</button>
        </div>
        <div id="refeicoes-hoje"></div>
        <div id="macros-hoje" style="margin-top:10px"></div>
      </div>
    </div>

    <div class="spacer"></div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="fabAction()">＋</button>

<!-- BOTTOM NAV -->
<nav class="bottomnav">
  <button class="bnav"><span class="bnav-ic">🏠</span><span>Hoje</span></button>
  <button class="bnav act"><span class="bnav-ic">💪</span><span>Saúde</span></button>
  <button class="bnav"><span class="bnav-ic">📚</span><span>Estudos</span></button>
  <button class="bnav"><span class="bnav-ic">💰</span><span>Finanças</span></button>
  <button class="bnav"><span class="bnav-ic">☰</span><span>Mais</span></button>
</nav>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="fecharSheet()">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════ STATE ═══════════════════════ */
const KEY = 'jarvis_saude_v1';
let S = {
  config:{nome:'Dr. Antonio', peso_meta:75, peso_inicial:null},
  peso:[],
  treinos:[],
  sono:[],
  plano_alimentar:null,
  refeicoes:[],
  planos_treino:[],
};
function loadS(){try{const d=localStorage.getItem(KEY);if(d)S={...S,...JSON.parse(d)};}catch(e){}}
function saveS(){localStorage.setItem(KEY,JSON.stringify(S));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
loadS();

const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function hoje(){return new Date();}
function hojeISO(){return hoje().toISOString().split('T')[0];}
function hojeStr(){const d=hoje();return `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`;}
function dataFmt(iso){const d=new Date(iso+'T12:00:00');return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;}
function pct(a,b){return b>0?Math.min(100,Math.round(a/b*100)):0;}

/* ═══════════════════════ TABS ═══════════════════════ */
let tabAtual = 'peso';
function mudarTab(t){
  tabAtual=t;
  document.querySelectorAll('.pg-tab').forEach(p=>p.classList.remove('act'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('act'));
  document.getElementById('pg-'+t)?.classList.add('act');
  document.getElementById('tab-'+t)?.classList.add('act');
  fabLabels[t]?.();
  ({peso:renderPeso,treinos:renderTreinos,sono:renderSono,nutricao:renderNutricao})[t]?.();
}
const fabLabels={
  peso:()=>{document.getElementById('fab').textContent='⚖️';},
  treinos:()=>{document.getElementById('fab').textContent='💪';},
  sono:()=>{document.getElementById('fab').textContent='😴';},
  nutricao:()=>{document.getElementById('fab').textContent='🥗';},
};
function fabAction(){
  ({peso:abrirRegistroPeso,treinos:abrirRegistroTreino,sono:abrirRegistroSono,nutricao:abrirRegistroRefeicao})[tabAtual]?.();
}

/* ═══════════════════════ PESO ═══════════════════════ */
function renderPeso(){
  const ultimos = S.peso.slice(-10);
  const atual = ultimos.length ? ultimos[ultimos.length-1] : null;
  const meta = S.config.peso_meta||75;
  const ini = S.config.peso_inicial || (ultimos.length ? ultimos[0].valor : null);
  const diff = atual ? (atual.valor - meta).toFixed(1) : null;
  const perdeu = ini && atual ? (ini - atual.valor).toFixed(1) : 0;

}

function renderGraficoPeso(dados){
  const canvas = document.getElementById('peso-chart');
  if(!canvas||!dados.length) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio || 400;
  canvas.height = 100 * window.devicePixelRatio || 100;
  ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
  const W = canvas.offsetWidth||400, H=100;

  if(dados.length < 2){ ctx.fillStyle='rgba(102,102,170,.3)'; ctx.font='12px Space Grotesk'; ctx.textAlign='center'; ctx.fillText('Registre pelo menos 2 pesagens para ver o gráfico',W/2,H/2); return; }

  const vals = dados.map(d=>d.valor);
  const min = Math.min(...vals)-1, max = Math.max(...vals)+1;
  const scaleY = v => H - ((v-min)/(max-min))*(H-20)-10;
  const scaleX = i => (i/(dados.length-1))*(W-20)+10;

  // gradient fill
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(0,245,212,.25)');
  grad.addColorStop(1,'rgba(0,245,212,0)');

  ctx.beginPath();
  ctx.moveTo(scaleX(0),scaleY(vals[0]));
  for(let i=1;i<vals.length;i++){
    const cp1x=(scaleX(i-1)+scaleX(i))/2, cp1y=scaleY(vals[i-1]);
    const cp2x=(scaleX(i-1)+scaleX(i))/2, cp2y=scaleY(vals[i]);
    ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,scaleX(i),scaleY(vals[i]));
  }
  ctx.lineTo(scaleX(vals.length-1),H);
  ctx.lineTo(scaleX(0),H);
  ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();

  // linha
  ctx.beginPath();
  ctx.moveTo(scaleX(0),scaleY(vals[0]));
  for(let i=1;i<vals.length;i++){
    const cp1x=(scaleX(i-1)+scaleX(i))/2;
    ctx.bezierCurveTo(cp1x,scaleY(vals[i-1]),cp1x,scaleY(vals[i]),scaleX(i),scaleY(vals[i]));
  }
  ctx.strokeStyle='var(--cyan)'; ctx.lineWidth=2; ctx.stroke();

  // pontos
  vals.forEach((v,i)=>{
    ctx.beginPath();
    ctx.arc(scaleX(i),scaleY(v),4,0,Math.PI*2);
    ctx.fillStyle='var(--cyan)'; ctx.fill();
    ctx.strokeStyle='var(--bg)'; ctx.lineWidth=2; ctx.stroke();
  });

  // meta line
  if(S.config.peso_meta && S.config.peso_meta>=min && S.config.peso_meta<=max){
    const my = scaleY(S.config.peso_meta);
    ctx.beginPath();
    ctx.setLineDash([4,4]);
    ctx.moveTo(10,my); ctx.lineTo(W-10,my);
    ctx.strokeStyle='rgba(34,197,94,.5)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(34,197,94,.8)'; ctx.font='10px JetBrains Mono'; ctx.textAlign='right';
    ctx.fillText(`meta ${S.config.peso_meta}kg`,W-4,my-4);
  }
}

function salvarMeta(){
  const m = parseFloat(document.getElementById('meta-peso').value);
  const a = parseFloat(document.getElementById('meta-atual').value);

    : S.treinos.slice(-6).reverse().map(t=>{

function calcularSequencia(){
  if(!S.treinos.length) return 0;
  const datas = [...new Set(S.treinos.map(t=>t.data_iso))].sort().reverse();
  let seq=0, d=new Date();
  for(const dt of datas){
    const diff=Math.round((d-new Date(dt+'T12:00:00'))/864e5);
    if(diff<=1){seq++;d=new Date(dt+'T12:00:00');}
    else break;
  }
  return seq;
}

function modalidadeFavorita(){
  if(!S.treinos.length) return '--';
  const cnt={};
  S.treinos.forEach(t=>{cnt[t.tipo]=(cnt[t.tipo]||0)+1;});
  const fav=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0];
  return MODALIDADES.find(m=>m.key===fav)?.ic||'💪';
}

function renderHeatmap(){
  const cells=[];
  const dias_label=['D','S','T','Q','Q','S','S'];
  const hoje_d=new Date(); hoje_d.setHours(0,0,0,0);
  for(let i=27;i>=0;i--){
    const d=new Date(hoje_d); d.setDate(d.getDate()-i);
    const iso=d.toISOString().split('T')[0];
    const treinos_dia=S.treinos.filter(t=>t.data_iso===iso);
    cells.push({iso,treinos:treinos_dia,dia:d.getDay()});
  }
  document.getElementById('hm-dias').innerHTML=dias_label.map(l=>`<span>${l}</span>`).join('');
  document.getElementById('heatmap').innerHTML=cells.map(c=>`
    <div class="hm-cell ${c.treinos.length>1?'treino':c.treinos.length===1?'treino-leve':''}"
      onclick="verDiaTreino('${c.iso}')"
      title="${c.iso}: ${c.treinos.length} treino${c.treinos.length!==1?'s':''}">
    </div>`).join('');
}

      </div>
    </div>`;

  // strip visual
  const strip=document.getElementById('sono-strip');
  const ultimos=S.sono.slice(-10);
  strip.innerHTML=ultimos.length===0
    ? `<div style="font-size:.78rem;color:var(--sub);padding:10px 0">Nenhum registro ainda.</div>`
    : ultimos.map(s=>{
      const hrs=s.horas+(s.min||0)/60;
      const pct_h=Math.min(100,Math.round(hrs/10*100));
      const cor=hrs>=7.5?'var(--grn)':hrs>=6?'var(--yel)':'var(--pink)';
      const d=new Date(s.data_iso+'T12:00:00');
      return `<div class="sono-bar-wrap">
        <div class="sono-bar-bg">
          <div class="sono-bar-fill" style="height:${pct_h}%;background:${cor}"></div>
        </div>
        <div class="sono-bar-label">${s.horas}h</div>
        <div class="sono-bar-dia">${['D','S','T','Q','Q','S','S'][d.getDay()]}</div>
      </div>`;
    }).join('');

  // historico
  document.getElementById('sono-historico').innerHTML=S.sono.length===0?'':
    `<div class="divider"></div>`+
    S.sono.slice(-5).reverse().map(s=>`
      <div class="list-item">
        <div class="list-ico" style="background:rgba(123,58,237,.08)">🌙</div>
        <div class="list-info">
          <div class="list-title">${s.horas}h${s.min?s.min+'min':''} · ${s.qualidade||'—'}</div>
          <div class="list-sub">${s.data_iso}</div>
        </div>
        <div class="list-right ${s.horas>=7.5?'pos':s.horas>=6?'neu':'neg'}">${s.horas}h</div>
      </div>`).join('');

  // análise
  const analise=gerarAnaliseSono(media,ultimos7);
  document.getElementById('sono-analise').innerHTML=`
    <div class="ia-bubble jarvis">${analise}</div>`;
}

function gerarAnaliseSono(media,ultimos){
  if(!media) return '📊 Registre seu sono por alguns dias para ver a análise aqui.';
  const ruins=ultimos.filter(s=>s.horas<6).length;
  const bons=ultimos.filter(s=>s.horas>=7.5).length;
  let txt='';
  if(media>=7.5) txt=`✅ Excelente! Média de ${media}h está acima da meta. Continue assim.`;
  else if(media>=6.5) txt=`⚠️ Média de ${media}h está próxima da meta (7h30). ${bons} noite${bons!==1?'s':''} com sono adequado na semana.`;
  else txt=`🔴 Atenção: média de ${media}h está abaixo do necessário. ${ruins} noite${ruins!==1?'s':''} com menos de 6h essa semana. Sono insuficiente impacta desempenho clínico e cognitivo.`;
  txt+=` Sua rotina de pós-graduação (até 22h10 seg/ter) compromete o tempo de sono. Tente dormir até 23h e acordar às 7h.`;
  return txt;
}

async function callClaude(prompt,system){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1500,system,
        messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    return d.content?.[0]?.text||'';
  }catch(e){return null;}
}

  if(!pergunta?.trim()) return;
  const el=document.getElementById('ia-resp');
  if(el) el.innerHTML=`<div class="ia-bubble jarvis ia-loading">⏳ Analisando...</div>`;

  const peso=S.peso.slice(-5).map(p=>`${p.data_iso}:${p.valor}kg`).join(', ');
  const treinos=S.treinos.slice(-7).map(t=>`${t.data_iso}:${t.tipo}(${t.duracao}min)`).join(', ');
  const sono=S.sono.slice(-5).map(s=>`${s.data_iso}:${s.horas}h`).join(', ');

  const system=`Você é o Jarvis, assistente de saúde do Dr. Antonio Roberto, médico em São Paulo.
Dados recentes:
- Peso (últimas pesagens): ${peso||'sem dados'}
- Treinos recentes: ${treinos||'sem dados'}
- Sono recente: ${sono||'sem dados'}
- Plano alimentar: ${S.plano_alimentar?JSON.stringify({obj:S.plano_alimentar.objetivo,kcal:S.plano_alimentar.kcal}):'não configurado'}
Responda em português brasileiro, de forma direta, pessoal e útil. Máximo 3 parágrafos.`;

  const res=await callClaude(pergunta,system);
  if(el) el.innerHTML=`<div class="ia-bubble jarvis">${res||'⚠️ Sem conexão com IA.'}</div>`;
}

/* ═══════════════════════ UTILS ═══════════════════════ */
function fecharSheet(){document.getElementById('overlay').classList.remove('open');}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);}
function updateDate(){document.getElementById('tbar-date').textContent=hojeStr();}

/* ═══════════════════════ INIT ═══════════════════════ */
updateDate();
renderPeso();
</script>
